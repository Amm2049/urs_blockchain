<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="50%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer container with rounded shield shape -->
  <rect x="32" y="32" width="448" height="448" rx="112" fill="url(#bgGrad)" stroke="url(#brandGrad)" stroke-width="16" />
  
  <!-- Inner subtle dashed ring -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#brandGrad)" stroke-width="4" stroke-dasharray="12 12" opacity="0.4" />
  
  <!-- Central URS Badge Logo with Glow -->
  <g filter="url(#glow)">
    <!-- Stylized 'U' Shield Crest -->
    <path d="M160 160 V280 C160 340, 200 376, 256 376 C312 376, 352 340, 352 280 V160 H304 V276 C304 310, 284 328, 256 328 C228 328, 208 310, 208 276 V160 H160 Z" fill="url(#brandGrad)" />
    
    <!-- Top Central Reward Star / Crown Gem -->
    <path d="M256 120 L267 142 L291 146 L274 163 L278 187 L256 176 L234 187 L238 163 L221 146 L245 142 Z" fill="url(#accentGrad)" />
  </g>
  
  <!-- Web3 Node Dots -->
  <circle cx="160" cy="160" r="14" fill="#34d399" />
  <circle cx="352" cy="160" r="14" fill="#06b6d4" />
  <circle cx="256" cy="376" r="14" fill="#10b981" />
</svg>